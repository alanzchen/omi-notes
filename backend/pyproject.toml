[project]
name = "omi-notes"
version = "0.1.0"
description = "Receives Omi wearable audio from the iPhone app, transcribes it, and writes markdown notes."
requires-python = ">=3.13,<3.15"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "numpy>=2.1",
    "onnxruntime>=1.20",
    "soundfile>=0.12",
    "httpx>=0.27",
    "anthropic>=0.70",
    "pyyaml>=6.0",
    "typer>=0.12",
    "qrcode>=8.0",
]

[project.scripts]
omi-notes = "omi_notes.cli:app"

[dependency-groups]
dev = [
    "httpx2>=2.0",
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omi_notes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning"]
