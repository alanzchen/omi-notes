# XcodeGen spec. Generate the (gitignored) project with:  cd ios && xcodegen generate
name: OmiNotes
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
packages:
  OmiKit:
    path: Packages/OmiKit
targets:
  OmiNotes:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    # Bundle id, team and versions come from the xcconfig so a personal Local.xcconfig can override them.
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    sources:
      - path: OmiNotes
      - path: Shared
    dependencies:
      - package: OmiKit
        product: OmiProtocol
      - package: OmiKit
        product: OmiCapture
      - package: OmiKit
        product: OmiBLE
      - package: OmiKit
        product: OmiWatchKit
      - target: OmiNotesWatch
      - target: OmiNotesLiveActivity
    settings:
      base:
        INFOPLIST_FILE: OmiNotes/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        # Info.plist is preprocessed so the ATS local-networking exception exists only in Debug
        # (release builds are HTTPS-only, matching ServerURLPolicy).
        INFOPLIST_PREPROCESS: YES
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        ENABLE_PREVIEWS: YES
        SWIFT_VERSION: "6.0"
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Release signing names a profile per target (passed on the command line for TestFlight).
        PROVISIONING_PROFILE_SPECIFIER: $(OMI_IOS_PROFILE)
      configs:
        Debug:
          INFOPLIST_PREPROCESSOR_DEFINITIONS: OMI_ALLOW_LOCAL_HTTP=1
  OmiNotesWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    sources:
      - path: OmiNotesWatch
    dependencies:
      - package: OmiKit
        product: OmiWatchKit
      - target: OmiNotesComplication
    info:
      path: OmiNotesWatch/Info.plist
      properties:
        CFBundleDisplayName: Omi Notes
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: $(OMI_APP_BUNDLE_ID)
        UIBackgroundModes: [audio]
        NSMicrophoneUsageDescription: Omi Notes records on your Apple Watch only while you have started a recording, and sends it to your iPhone for your notes.
        # shared with the complication extension (keychain group in both apps' entitlements)
        OmiSharedKeychainGroup: $(AppIdentifierPrefix)dev.omi-notes.shared
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: OmiNotesWatch/OmiNotesWatch.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: $(OMI_APP_BUNDLE_ID).watchkitapp
        PRODUCT_NAME: OmiNotesWatch
        SWIFT_VERSION: "6.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        PROVISIONING_PROFILE_SPECIFIER: $(OMI_WATCH_PROFILE)
        SKIP_INSTALL: YES
  # The circular watch-face complication (WidgetKit), embedded in the Watch app. It reads the Watch
  # app's snapshot through the shared keychain group in both entitlements files.
  OmiNotesComplication:
    type: app-extension
    platform: watchOS
    deploymentTarget: "10.0"
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    sources:
      - path: OmiNotesComplication
    dependencies:
      - package: OmiKit
        product: OmiWatchKit
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        # registered App ID (Omi Notes Watch Complication)
        PRODUCT_BUNDLE_IDENTIFIER: $(OMI_APP_BUNDLE_ID).watchkitapp.widgets
        PRODUCT_NAME: OmiNotesComplication
        INFOPLIST_FILE: OmiNotesComplication/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: OmiNotesComplication/OmiNotesComplication.entitlements
        SWIFT_VERSION: "6.0"
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        # Release signing names a profile per target (passed on the command line for TestFlight).
        PROVISIONING_PROFILE_SPECIFIER: $(OMI_COMPLICATION_PROFILE)
  # The sync Live Activity (Lock Screen and Dynamic Island), embedded in the iPhone app. Presentation
  # only: the app updates it while it runs; it never fetches anything itself.
  OmiNotesLiveActivity:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    sources:
      - path: OmiNotesLiveActivity
      - path: Shared
    dependencies:
      - package: OmiKit
        product: OmiProtocol
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: ActivityKit.framework
    settings:
      base:
        # needs its own registered App ID and App Store profile before a release (not yet registered)
        PRODUCT_BUNDLE_IDENTIFIER: $(OMI_APP_BUNDLE_ID).liveactivity
        PRODUCT_NAME: OmiNotesLiveActivity
        INFOPLIST_FILE: OmiNotesLiveActivity/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "6.0"
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        TARGETED_DEVICE_FAMILY: "1"
        PROVISIONING_PROFILE_SPECIFIER: $(OMI_LIVE_ACTIVITY_PROFILE)
schemes:
  OmiNotes:
    build:
      targets:
        OmiNotes: all
    run:
      config: Debug
    archive:
      config: Release
